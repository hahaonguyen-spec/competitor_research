name: Scan competitor intelligence

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These are 00:00, 06:00, 12:00 and 18:00 in Vietnam (UTC+7).
    - cron: "0 5,11,17,23 * * *"

permissions:
  contents: write

concurrency:
  group: competitor-intelligence-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh official pages, news and configured social APIs
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python scripts/scan.py
      - name: Commit refreshed data when changed
        run: |
          git config user.name "competitor-intelligence-bot"
          git config user.email "competitor-intelligence-bot@users.noreply.github.com"
          git add data/latest.json data/history
          if git diff --cached --quiet; then
            echo "No material data change"
          else
            git commit -m "data: refresh competitor intelligence"
            git push
          fi

